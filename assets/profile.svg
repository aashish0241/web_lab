<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="300" height="300">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="#e0e0e0" />
  
  <!-- Head -->
  <circle cx="200" cy="150" r="100" fill="#f5d5c5" />
  
  <!-- Hair -->
  <path d="M200 50 Q 120 50 120 150 Q 120 180 140 200 L 260 200 Q 280 180 280 150 Q 280 50 200 50 Z" fill="#4a2c2a" />
  
  <!-- Face -->
  <circle cx="160" cy="130" r="15" fill="#333" /> <!-- Left Eye -->
  <circle cx="240" cy="130" r="15" fill="#333" /> <!-- Right Eye -->
  
  <!-- Smile -->
  <path d="M160 180 Q 200 220 240 180" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" />
  
  <!-- Shirt/Clothing -->
  <path d="M120 250 L 120 350 L 280 350 L 280 250 Q 240 280 200 280 Q 160 280 120 250 Z" fill="#007bff" />
  
  <!-- Neck -->
  <path d="M170 200 L 170 250 L 230 250 L 230 200 Z" fill="#f5d5c5" />
</svg>
